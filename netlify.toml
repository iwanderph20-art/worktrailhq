[build]
  publish = "."
  functions = "netlify/functions"

# Break-reminder push sender — runs every minute to alert clocked-in staff
# whose break is due (works on a locked phone). See netlify/functions/break-push.js.
[functions."break-push"]
  schedule = "* * * * *"

# Clean, shareable URL for Dr. Hossain's booking page.
# worktrailhq.com/book  ->  serves the booking page (URL stays /book).
[[redirects]]
  from = "/book"
  to = "/products/scheduling/hossain-booking.html"
  status = 200

[[headers]]
  for = "/lab-compliance/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
